name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  id-token: write   # needed to get the OIDC token
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  APP_NAME: echo-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to the container registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push the image
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE_REF="${{ vars.ACR_NAME }}.azurecr.io/echo-backend:${TAG}"
          docker build -t "$IMAGE_REF" ./backend
          docker push "$IMAGE_REF"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

      - name: Deploy the new image
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "$IMAGE_REF"

      - name: Check the app is healthy
        run: |
          FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "${{ vars.RESOURCE_GROUP }}" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 24); do
            if curl -fsS "https://$FQDN/api/v1/health"; then
              echo; echo "Healthy: $IMAGE_REF"; exit 0
            fi
            echo "Waiting for the new revision... ($i)"; sleep 10
          done
          echo "App did not become healthy"; exit 1